<div class="card full"><h2>नक्षत्र-दूरी तालिका</h2><div class="chips2">${pls.map(p=>`<label class="chip"><input type="checkbox" data-mx="${p.p}" style="width:auto" ${S.mxp.includes(p.p)?'checked':''}> ${p.nm}</label>`).join('')}<button data-mxa="all">सभी</button><button data-mxa="none">कोई नहीं</button></div><small>ऊपर से ग्रह चुनें। पंक्ति के ग्रह से कॉलम के ग्रह तक गिनती (पंक्ति वाले ग्रह का अपना नक्षत्र = 1)।</small><div class="tw"><table class="mx"><tr><th></th>${mp.map(p=>`<th>${HA[p.p]}</th>`).join('')}</tr>${mp.map(a=>`<tr><th>${a.nm}</th>${mp.map(b=>`<td class="${a===b?'s':''}">${a===b?'•':cn(a,b)}</td>`).join('')}</tr>`).join('')}</table></div></div>
<div class="card full"><h2>जोड़ी-वार विवरण</h2><small>सीधी गिनती: पहले ग्रह के नक्षत्र को 1 मानकर दूसरे ग्रह का नक्षत्र कितनवाँ है। बीच के नक्षत्र = दोनों के बीच के पूरे नक्षत्र (गिनती − 2)। उल्टी गिनती: दूसरे ग्रह से पहले ग्रह तक। राहु-केतु हमेशा 14वें या 15वें नक्षत्र पर होते हैं (180° की दूरी)। अरुण, वरुण, प्लूटो आधुनिक ग्रह हैं; ये मुहूर्त स्कोर में नहीं गिने जाते।</small></div><div class="full chg" style="margin-top:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px">${pls.slice(0,-1).map((a,i)=>`<div class="card pc"><h3>${a.nm} (${nkl(a.n)})</h3><div class="tw"><table class="wrap"><tr><th>जोड़ी</th><th>नक्षत्र</th><th>सीधी</th><th>बीच</th><th>उल्टी</th></tr>${pls.slice(i+1).map(b=>{const c=cn(a,b),r=cn(b,a);return `<tr><td>${a.nm} → ${b.nm}</td><td>${nkl(b.n)}</td><td>${c==1?'एक ही':c+'वाँ'}</td><td>${c<=2?0:c-2}</td><td>${r==1?'एक ही':r+'वाँ'}</td></tr>`}).join('')}</table></div></div>`).join('')}</div>`;
 $('#s-nk').querySelectorAll('[data-mx]').forEach(c=>c.onchange=()=>{const p=c.dataset.mx;S.mxp=c.checked?[...S.mxp,p]:S.mxp.filter(x=>x!==p);svm();refresh()});
 $('#s-nk').querySelectorAll('[data-mxa]').forEach(b=>b.onclick=()=>{S.mxp=b.dataset.mxa==='all'?pls.map(p=>p.p):[];svm();refresh()});
 $('#s-det').innerHTML=`<div class="card"><h2>Calculation details</h2><div class="tw"><table>${row('Engine','Astronomy Engine 2.1.19 (apparent geocentric positions)')}${row('Zodiac / ayanamsha','Sidereal, Lahiri ('+ayan(S.ms).toFixed(4)+'°)')}${row('Lagna','Ascendant from local sidereal time, mean obliquity (no house system used)')}${row('Location',S.lat+', '+S.lon)}${row('Timezone',S.tz)}${row('Tara','Count from birth nakshatra to today\'s, modulo 9')}${row('Chandra bala','Moon rashi counted from birth rashi')}${row('Score','Application-based assessment, not a classical rule')}</table></div><p><b>Rule status.</b> Every flag shown (Rikta tithi, Vishti karana, inauspicious yogas, Panchak, Rahu kalam, tara and Chandra bala) is <b>general astrological guidance</b>. None is verified here as a direct Muhurta Chintamani quotation, and none is presented as one.</p></div>`;
}
const ms0=()=>S.ms;
function tick(){$('#clk').textContent=''}
function refresh(){CACHE.clear();$('#err').hidden=true;try{if(typeof Astronomy==='undefined')throw new Error('Ephemeris engine failed to load');R=compute();render();renderAI();applyLang()}catch(e){$('#err').hidden=false;$('#err').textContent='Calculation unavailable: '+e.message}syncInputs()}
function syncInputs(){const p=lp(S.ms);$('#d').value=`${p.year}-${p.month}-${p.day}`;$('#t').value=`${p.hour}:${p.minute}`;$('#lat').value=S.lat;$('#lon').value=S.lon;$('#tz').value=S.tz}
function fromInputs(){const[d,t]=[$('#d').value,$('#t').value||'00:00'];const[y,m,dd]=d.split('-').map(Number),[h,mi]=t.split(':').map(Number);const g=Date.UTC(y,m-1,dd,h,mi);S.ms=g-tzOff(g)*60000}
$('#bn').innerHTML=N.map((n,i)=>`<option value="${i}">${n}</option>`).join('');$('#bn').value=10;
$('#br').innerHTML=RA.map((n,i)=>`<option value="${i}">${n}</option>`).join('');$('#br').value=4;
$('#bn').onchange=()=>{$('#br').value=Math.floor(+$('#bn').value*NK/30);refresh()};$('#br').onchange=refresh;
['d','t'].forEach(i=>$('#'+i).onchange=()=>{S.live=false;fromInputs();refresh()});
['lat','lon','tz'].forEach(i=>$('#'+i).onchange=()=>{try{const lat=+$('#lat').value,lon=+$('#lon').value,tz=$('#tz').value;new Intl.DateTimeFormat('en',{timeZone:tz});S.lat=lat;S.lon=lon;S.tz=tz}catch(e){}refresh()});
$('#prev').onclick=()=>{S.live=false;S.ms-=864e5;refresh()};$('#next').onclick=()=>{S.live=false;S.ms+=864e5;refresh()};$('#now').onclick=()=>{S.live=true;S.ms=Date.now();refresh()};
$('#gps').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{S.lat=+p.coords.latitude.toFixed(4);S.lon=+p.coords.longitude.toFixed(4);S.tz=Intl.DateTimeFormat().resolvedOptions().timeZone;refresh()},()=>{$('#err').hidden=false;$('#err').textContent='Location permission denied. Enter coordinates manually.'});
const TABS=[['dash','🏠 आज'],['pan','📜 पंचांग'],['lag','🌅 लग्न'],['tara','⭐ तारा'],['pl','🪐 गोचर'],['nk','🌟 नक्षत्र'],['ai','✨ मुहूर्त'],['det','ℹ️ विवरण']];
$('#nav').innerHTML=TABS.map(([k,n])=>`<button data-k="${k}" class="${k=='dash'?'on':''}">${n}</button>`).join('');
$('#nav').onclick=e=>{const k=e.target.dataset.k;if(!k)return;S.tab=k;$('#top').style.display=['dash','lag'].includes(k)?'':'none';if(k==='pl')setTimeout(refresh,0);document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id=='s-'+k));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k))};
setInterval(()=>{if(S.live){S.ms=Date.now();const edge=[R&&R.nak.end,R&&R.tith.end,R&&R.yoga.end,R&&R.kar.end].some(x=>x&&S.ms>=x),lg=R&&R.lag.some(l=>S.ms>=l.end&&S.ms<l.end+30000);if(!R||edge||lg||S.ms%60000<1000||true){if(Math.floor(S.ms/30000)!==S.last){S.last=Math.floor(S.ms/30000);refresh()}}}},1000);
const THEMES={dark:'डार्क नेवी',light:'लाइट',saffron:'केसरिया',forest:'जंगल हरा',royal:'रॉयल बैंगनी'};
let th;try{th=localStorage.getItem('theme')}catch(e){}
if(!THEMES[th])th=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.dataset.theme=th;
$('#theme').innerHTML=Object.keys(THEMES).map(k=>`<option value="${k}" ${k==th?'selected':''}>${THEMES[k]}</option>`).join('');
$('#theme').onchange=e=>{document.documentElement.dataset.theme=e.target.value;try{localStorage.setItem('theme',e.target.value)}catch(x){}};
$('#lang').innerHTML=Object.keys(LANGS).map(k=>`<option value="${k}" ${k==LANG?'selected':''}>${LANGS[k]}</option>`).join('');
$('#lang').onchange=e=>{LANG=e.target.value;try{localStorage.setItem('lang',LANG)}catch(x){}refresh()};
$('#gt').onclick=()=>window.open('https://translate.google.com/translate?sl=auto&tl='+(LANG==='hi'?'en':LANG)+'&u='+encodeURIComponent(location.href),'_blank');
S.live=true;refresh();
</script></body></html>
